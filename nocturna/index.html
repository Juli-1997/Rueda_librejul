<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna · Jueves a sábado</title>
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-950 text-white">

    <main class="max-w-5xl mx-auto px-6 py-20">
        <section class="bg-slate-900 px-6 py-16 md:px-16 text-center rounded-2xl shadow-xl">
            <p class="inline-block bg-amber-400 text-slate-950 px-4 py-2 text-sm font-bold uppercase tracking-widest mb-8">
                Nuevo · Jueves a sábado
            </p>

            <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-6">
                Rueda Nocturna
            </h1>

            <h3 class="text-lg md:text-xl text-slate-300 leading-relaxed max-w-2xl mx-auto mb-10">
                Descubre Medellín en bici cuando se encienden las luces
            </h3>

            <section class="flex flex-col sm:flex-row justify-center gap-6">
                <article class="max-w-sm mx-auto bg-blue-800 rounded-xl shadow-lg hover:shadow-2xl transition-shadow duration-300 overflow-hidden">
                    <img class="w-full h-48 object-cover" src="../img/cieloestrellado.jpg" alt="Ciclistas de noche">

                    <div class="p-5">
                        <h2 class="text-xl font-bold text-center text-white">
                            3 Rutas
                        </h2>
                    </div>

                </article>

                <article class="max-w-sm mx-auto bg-blue-800 rounded-xl shadow-lg hover:shadow-2xl transition-shadow duration-300 overflow-hidden">
                    <img class="w-full h-48 object-cover" src="../img/datointeresante.jpg" alt="Experiencia de ciclismo nocturno">
                    <div class="p-5">
                        <h2 class="text-xl font-bold text-center text-white">
                            Desde $55.000
                        </h2>
                    </div>
                </article>
            </section>

            <section class="mt-12">
                <h2 class="text-xl font-bold mb-6">
                    Elige tu experiencia
                </h2>

                <div class="flex flex-wrap justify-center gap-10">
                    <a href="#inscripcion" class="bg-amber-400 text-slate-950 px-8 py-4 text-base font-bold uppercase tracking-wider rounded-lg shadow-md transition-all duration-300 hover:bg-amber-300 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900">
                        Inscríbete
                    </a>

                    <button type="button"
                            class="bg-slate-700 text-white px-8 py-4 text-base font-bold uppercase tracking-wider rounded-lg shadow-md transition-all duration-300 hover:bg-slate-600 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-slate-300 focus:ring-offset-2 focus:ring-offset-slate-900">
                        Ver rutas
                    </button>

                    <button type="button" class="border-2 border-amber-400 text-amber-400 px-8 py-4 text-base font-bold uppercase tracking-wider rounded-lg transition-all duration-300 hover:bg-amber-400 hover:text-slate-950 focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900">
                        Más información
                    </button>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
