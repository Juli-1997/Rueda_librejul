<!DOCTYPE html>
<html lang="es">

          <section class="flex flex-row justify-center gap-6">

                  <div class="p-5">

          <a href="#inscripcion" class="inline-block mt-10 bg-amber-400 text-slate-950 px-10 py-4 text-lg font-bold uppercase tracking-wider">
              Inscríbete

        </section>

</body>
</html>
